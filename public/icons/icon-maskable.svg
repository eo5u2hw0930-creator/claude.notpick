<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Safe zone content (inner 80%) offset by 10% = 51.2px padding -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Waveform lines -->
    <g stroke="#e94560" stroke-width="4" fill="none" opacity="0.3">
      <line x1="60" y1="256" x2="452" y2="256"/>
      <line x1="60" y1="200" x2="452" y2="200"/>
      <line x1="60" y1="312" x2="452" y2="312"/>
    </g>
    <!-- Waveform -->
    <polyline points="80,256 110,200 130,280 160,180 190,300 210,220 240,290 260,190 290,310 310,210 340,270 360,200 390,280 410,240 440,256"
      stroke="#e94560" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stylus pen -->
    <g transform="translate(320, 100) rotate(35)">
      <rect x="0" y="0" width="16" height="120" rx="4" fill="#8892b0"/>
      <rect x="0" y="0" width="16" height="30" rx="4" fill="#e94560"/>
      <polygon points="4,120 12,120 8,145" fill="#eaeaea"/>
    </g>
    <!-- Note -->
    <g fill="#e94560">
      <circle cx="130" cy="380" r="18"/>
      <rect x="146" y="310" width="5" height="70"/>
      <circle cx="200" cy="370" r="18"/>
      <rect x="216" y="300" width="5" height="70"/>
      <rect x="146" y="308" width="75" height="6" rx="2"/>
    </g>
    <!-- Text -->
    <text x="256" y="460" text-anchor="middle" fill="#eaeaea" font-family="system-ui, sans-serif" font-size="48" font-weight="700">NotPick</text>
  </g>
</svg>
